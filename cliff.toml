# git-cliff configuration
# Docs: https://git-cliff.org/docs/configuration
#
# Generate the changelog with: pnpm changelog

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).
Auto-generated by [git-cliff](https://git-cliff.org) — edit `cliff.toml`, not this file.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
    {{ commit.message | split(pat="\n") | first | trim }} \
    ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/hassanharga/my-progress/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^perf", group = "Performance" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^style", group = "Styling" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI/CD" },
    { message = "^revert", group = "Reverted Commits" },
    { message = "^chore", group = "Miscellaneous" },
    { message = ".*", group = "Miscellaneous" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
